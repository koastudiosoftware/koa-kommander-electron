<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Koa Kommander</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="tool-row" aria-label="Toolbar">
      <button class="dummy-tool" data-action="new-folder" title="New folder" aria-label="New folder"><img class="svg-icon" src="./assets/material-icons_create_new_folder.svg" alt="" aria-hidden="true" draggable="false"></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" data-action="back" title="Back" aria-label="Back" disabled><img class="svg-icon" src="./assets/material-icons_arrow_back.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" data-action="forward" title="Forward" aria-label="Forward" disabled><img class="svg-icon" src="./assets/material-icons_arrow_forward.svg" alt="" aria-hidden="true" draggable="false"></button>
      <span class="tool-divider"></span>
      <button class="dummy-tool" data-action="copy" title="Copy (Ctrl+C)" aria-label="Copy"><img class="svg-icon" src="./assets/material-icons_file_copy.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" data-action="cut" title="Cut (Ctrl+X)" aria-label="Cut"><img class="svg-icon" src="./assets/material-icons_content_cut.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" data-action="paste" title="Paste (Ctrl+V)" aria-label="Paste"><img class="svg-icon" src="./assets/material-icons_content_paste.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" data-action="rename" title="Rename selected item" aria-label="Rename"><img class="svg-icon" src="./assets/material-icons_drive_file_rename_outline.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" data-action="delete" title="Delete (Delete)" aria-label="Delete"><img class="svg-icon" src="./assets/material-icons_delete.svg" alt="" aria-hidden="true" draggable="false"></button>
      <span class="tool-spacer"></span>
      <form class="global-search" id="global-search" role="search">
        <label class="search-mode-wrap" aria-label="Search matching style"><span aria-hidden="true">⌕</span><select id="search-mode" aria-label="Search matching style"><option value="partial">Name</option><option value="glob">Glob</option><option value="regex">Regex</option></select></label>
        <input id="search-query" type="search" placeholder="Search active panel…" aria-label="Search file names recursively" autocomplete="off" spellcheck="false">
        <button type="button" id="search-cancel" aria-label="Cancel search" title="Cancel search" hidden>×</button>
      </form>
      <button class="dummy-tool" id="settings-button" title="Settings" aria-label="Settings"><img class="svg-icon" src="./assets/material-icons_settings.svg" alt="" aria-hidden="true" draggable="false"></button>
      <button class="dummy-tool" id="about-button" data-action="about" title="About Koa Kommander" aria-label="About Koa Kommander"><img class="svg-icon" src="./assets/material-icons_info.svg" alt="" aria-hidden="true" draggable="false"></button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel is-active" id="panel-left" data-panel="left" aria-label="Left file panel"></section>
    <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panels" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="-1"><div class="splitter-handle"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <section class="panel" id="panel-right" data-panel="right" aria-label="Right file panel"></section>
  </main>

  <footer class="statusbar">
    <div class="status-left"><span class="status-dot"></span><span id="status-message">Ready</span></div>
    <div class="status-right"><span id="drive-space-summary">Reading drive space…</span></div>
  </footer>

  <div class="context-menu" id="context-menu" role="menu" hidden></div>
  <div class="history-menu" id="history-menu" role="menu" aria-label="Directory history" hidden></div>
  <div class="directory-set-menu" id="directory-set-menu" role="menu" aria-label="Saved directory sets" hidden></div>
  <div class="drive-context-menu" id="drive-context-menu" role="menu" aria-label="Drive actions" hidden></div>
  <div class="drop-action-menu" id="drop-action-menu" role="menu" aria-label="Choose drag and drop action" hidden>
    <button role="menuitem" data-drop-choice="copy">Copy here</button>
    <button role="menuitem" data-drop-choice="move">Move here</button>
    <button role="menuitem" data-drop-choice="shortcut">Create shortcut(s) here</button>
    <div class="menu-separator"></div>
    <button role="menuitem" data-drop-choice="cancel">Cancel</button>
  </div>
  <div class="conflict-backdrop" id="conflict-backdrop" hidden>
    <section class="conflict-dialog" role="dialog" aria-modal="true" aria-labelledby="conflict-title">
      <header class="conflict-header"><div><h2 id="conflict-title">An item with this name already exists</h2><p>Choose what to do with the incoming item.</p></div></header>
      <div class="conflict-items" id="conflict-items"></div>
      <div class="conflict-rename" id="conflict-rename" hidden><label for="conflict-rename-name">New name for incoming item</label><div><input id="conflict-rename-name"><button class="conflict-choice primary" data-conflict-confirm-rename>Use this name</button></div></div>
      <footer class="conflict-actions" id="conflict-actions"></footer>
    </section>
  </div>
  <div class="settings-backdrop" id="settings-backdrop" hidden>
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header"><div><h1 id="settings-title">Settings</h1><p>Configure Koa Kommander</p></div><button class="settings-close" id="settings-close" aria-label="Close settings" title="Close">×</button></header>
      <div class="settings-layout"><nav class="settings-categories" aria-label="Settings categories">
        <button class="settings-category active" data-category="files">Files &amp; Folders</button>
        <button class="settings-category" data-category="date-time">Date &amp; Time</button>
        <button class="settings-category" data-category="theme">Theme</button>
        <button class="settings-category" data-category="thumbnails">Thumbnails</button>
        <button class="settings-category" data-category="directory-sets">Directory Sets</button>
      </nav><div class="settings-content" id="settings-content"></div></div>
    </section>
  </div>
  <div class="name-dialog-backdrop" id="name-dialog-backdrop" hidden>
    <section class="name-dialog" role="dialog" aria-modal="true" aria-labelledby="name-dialog-title">
      <h2 id="name-dialog-title"></h2>
      <form id="name-dialog-form">
        <label id="name-dialog-label" for="name-dialog-input"></label>
        <input id="name-dialog-input" autocomplete="off" spellcheck="false">
        <footer><button class="settings-secondary" type="button" id="name-dialog-cancel">Cancel</button><button class="settings-primary" type="submit" id="name-dialog-submit"></button></footer>
      </form>
    </section>
  </div>
  <div class="about-backdrop" id="about-backdrop" hidden>
    <section class="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <button class="settings-close about-close" id="about-close" aria-label="Close About" title="Close">×</button>
      <img src="./assets/koa-kommander-icon.png" alt="Koa Kommander icon">
      <h2 id="about-title">Koa Kommander</h2>
      <p id="about-version">Version</p>
      <p>A focused dual-panel file manager for Windows.</p>
    </section>
  </div>
  <div class="properties-backdrop" id="properties-backdrop" hidden>
    <section class="properties-dialog" role="dialog" aria-modal="true" aria-labelledby="properties-title">
      <header class="properties-header"><h2 id="properties-title">Properties</h2><button class="settings-close" id="properties-close" aria-label="Close Properties" title="Close">×</button></header>
      <div id="properties-content"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
